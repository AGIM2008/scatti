<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Annulla prenotazione</title>
<style>
  body { margin:0; font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:#f6f3ec; color:#222; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  .card { background:#fff; border:1px solid #ddd6c8; border-radius:14px; padding:16px; margin:14px 0; }
  h1 { color:#1f5d46; font-size:24px; margin:8px 0; }
  .sum { background:#eef6f1; border-radius:10px; padding:10px 12px; margin:8px 0; }
  button { width:100%; padding:14px; font-size:17px; font-weight:700; color:#fff; background:#b3342b; border:0; border-radius:12px; cursor:pointer; margin-top:10px; }
  button:disabled { opacity:.5; }
  .err { background:#fdecea; color:#8a1f17; border-radius:10px; padding:10px 12px; }
</style>
</head>
<body>
<main>
  <h1>Annulla prenotazione</h1>
  <div class="card" id="box">Carico…</div>
</main>
<script src="config.js"></script>
<script>
  const API = window.SCATTI_API || '';
  function api(action, extra) {
    if (!API || API.indexOf('INCOLLA') === 0) return Promise.reject(new Error('API non configurata'));
    return fetch(API, { method: 'POST', redirect: 'follow', body: JSON.stringify(Object.assign({ action: action }, extra || {})) })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  }

  const token = new URLSearchParams(location.search).get('t') || '';
  const box = document.getElementById('box');
  function err(m) { box.innerHTML = ''; const d = document.createElement('div'); d.className = 'err'; d.textContent = m; box.appendChild(d); }
  if (!/^[A-Za-z0-9-]{20,64}$/.test(token)) { err('Link non valido.'); }
  else api('bookingByToken', { token: token }).then(r => {
    if (!r.ok) return err(r.error);
    box.innerHTML = '<p>Stai per liberare questa prenotazione:</p>' +
      r.items.map(i => '<div class="sum"><b>' + i.tipo + '</b><br>' + i.giorno + ', fascia ' + i.fascia + '</div>').join('') +
      '<button id="b">Sì, annulla la prenotazione</button>';
    document.getElementById('b').onclick = function () {
      this.disabled = true;
      api('cancel', { token: token }).then(x => {
        if (!x.ok) return err(x.error);
        box.innerHTML = '<p><b>Prenotazione annullata.</b> Lo slot è tornato disponibile per altre famiglie. Puoi prenotare di nuovo dal link originale.</p>';
      }).catch(() => err('Connessione interrotta, riprova.'));
    };
  }).catch(() => err('Impossibile caricare, riprova.'));
</script>
</body>
</html>
