<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Cassa – Scatti di Natale</title>
<style>
  :root { --g:#1f5d46; --r:#b3342b; --bg:#f6f3ec; --line:#ddd6c8; --mut:#6b6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:#222; }
  main { max-width:680px; margin:0 auto; padding:16px; }
  h1 { color:var(--g); font-size:24px; margin:6px 0 2px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; margin:12px 0; }
  input[type=text], input[type=password], select { width:100%; padding:12px; font-size:16px; border:1px solid #bbb; border-radius:10px; background:#fff; }
  button { font-size:16px; border-radius:10px; cursor:pointer; }
  .go { width:100%; margin-top:12px; padding:14px; font-weight:700; color:#fff; background:var(--g); border:0; }
  .go:disabled { opacity:.5; }
  .sec { background:#eef2ef; border:0; color:var(--g); padding:10px 14px; }
  .res { border:1px solid var(--line); border-radius:12px; padding:12px; margin:8px 0; cursor:pointer; background:#fff; }
  .res:hover { border-color:var(--g); }
  .tag { display:inline-block; font-size:13px; padding:2px 8px; border-radius:10px; background:#eef6f1; color:var(--g); margin-right:6px; }
  .tag.warn { background:#fdecea; color:#8a1f17; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid #eee; }
  .step { display:flex; align-items:center; gap:10px; }
  .step button { width:44px; height:44px; font-size:22px; border:1px solid var(--g); background:#fff; color:var(--g); }
  .step span { min-width:28px; text-align:center; font-size:20px; font-weight:700; }
  .tot { display:flex; justify-content:space-between; font-size:22px; font-weight:800; padding:12px 0; }
  .err { background:#fdecea; color:#8a1f17; border-radius:10px; padding:10px 12px; margin-top:10px; }
  .muted { color:var(--mut); font-size:14px; }
  .hide { display:none; }
  label.f { display:block; margin:10px 0 4px; font-weight:600; }
  .two { display:flex; gap:10px; } .two > div { flex:1; min-width:0; } .two > div:first-child { flex:0 0 38%; }
</style>
</head>
<body>
<main>
  <h1>🎄 Cassa – Scatti di Natale</h1>
  <p class="muted">Solo per i volontari.</p>

  <section class="card" id="login">
    <label class="f" for="pin">PIN cassa</label>
    <input type="password" id="pin" autocomplete="off" inputmode="text">
    <button class="go" id="bLogin">Entra</button>
    <div class="err hide" id="eLogin"></div>
  </section>

  <section id="app" class="hide">
    <div class="card" id="searchCard">
      <label class="f" for="q">Cerca famiglia (cognome, bambino, email o telefono)</label>
      <input type="text" id="q" autocomplete="off">
      <button class="go" id="bSearch">Cerca</button>
      <div class="err hide" id="eSearch"></div>
      <div id="results"></div>
    </div>

    <div class="card hide" id="orderCard">
      <button class="sec" id="bBack">← Torna alla ricerca</button>
      <h2 id="oTitle" style="margin:10px 0 2px"></h2>
      <div id="oTags"></div>
      <div class="two">
        <div><label class="f" for="oCls">Classe</label><input type="text" id="oCls" autocomplete="off"></div>
        <div><label class="f" for="oIst">Istituto di consegna</label><select id="oIst"></select></div>
      </div>
      <div id="lines"></div>
      <div class="tot"><span>Totale</span><span id="total">0,00 €</span></div>
      <label class="f" for="metodo">Pagamento ricevuto con</label>
      <select id="metodo"><option value="">Scegli…</option><option>Contanti</option><option>Carta/POS</option><option>Satispay</option><option>Altro</option></select>
      <label class="f" for="oper">Il tuo nome (volontario)</label>
      <input type="text" id="oper" autocomplete="off">
      <div class="err hide" id="eOrder"></div>
      <button class="go" id="bConfirm">Conferma pagamento e invia ricevuta</button>
    </div>

    <div class="card hide" id="doneCard">
      <h2 style="color:var(--g)">✅ Ordine registrato</h2>
      <div id="doneLines"></div>
      <div class="tot"><span>Incassato</span><span id="doneTot"></span></div>
      <p class="muted" id="doneMail"></p>
      <button class="go" id="bNext">Prossima famiglia</button>
    </div>
  </section>
</main>

<script src="config.js"></script>
<script>

  const API = window.SCATTI_API || '';
  function api(action, extra) {
    if (!API || API.indexOf('INCOLLA') === 0) return Promise.reject(new Error('API non configurata'));
    return fetch(API, { method: 'POST', redirect: 'follow', body: JSON.stringify(Object.assign({ action: action }, extra || {})) })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  }

  const $ = id => document.getElementById(id);
  let PIN = '', PRICES = null, GRATIS = [], ISTITUTI = [], CUR = null, QTY = {};
  const eur = c => (c / 100).toFixed(2).replace('.', ',') + ' €';
  function show(id, msg) { const e = $(id); e.textContent = msg; e.classList.remove('hide'); }
  function hide(id) { $(id).classList.add('hide'); }

  $('bLogin').onclick = () => {
    hide('eLogin'); PIN = $('pin').value;
    $('bLogin').disabled = true;
    api('cassaLogin', { pin: PIN }).then(r => {
      $('bLogin').disabled = false;
      if (!r.ok) return show('eLogin', r.error);
      PRICES = r.prezzi; GRATIS = r.digitaleGratisCon; ISTITUTI = r.istituti || [];
      $('login').classList.add('hide'); $('app').classList.remove('hide'); $('q').focus();
    }).catch(() => { $('bLogin').disabled = false; show('eLogin', 'Connessione interrotta.'); });
  };
  $('pin').addEventListener('keydown', e => { if (e.key === 'Enter') $('bLogin').click(); });
  $('q').addEventListener('keydown', e => { if (e.key === 'Enter') $('bSearch').click(); });

  $('bSearch').onclick = () => {
    hide('eSearch'); $('results').innerHTML = '';
    $('bSearch').disabled = true;
    api('cassaSearch', { pin: PIN, q: $('q').value }).then(r => {
      $('bSearch').disabled = false;
      if (!r.ok) return show('eSearch', r.error);
      if (!r.results.length) { $('results').innerHTML = '<p class="muted">Nessuna prenotazione trovata.</p>'; return; }
      r.results.forEach(g => {
        const d = document.createElement('div'); d.className = 'res';
        d.innerHTML = '<b></b> <span class="muted"></span><div></div>';
        d.querySelector('b').textContent = g.gen;
        d.querySelector('span').textContent = '· ' + g.bamb + ' (' + g.classe + (g.istituto ? ' – ' + g.istituto : '') + ')';
        const t = d.lastChild;
        g.items.forEach(i => { const s = document.createElement('span'); s.className = 'tag'; s.textContent = i.label + ' – ' + i.giorno + ' ' + i.arrivo; t.appendChild(s); });
        if (g.ordinato) { const s = document.createElement('span'); s.className = 'tag warn'; s.textContent = 'ordine già registrato'; t.appendChild(s); }
        d.onclick = () => openOrder(g);
        $('results').appendChild(d);
      });
    }).catch(() => { $('bSearch').disabled = false; show('eSearch', 'Connessione interrotta.'); });
  };

  function openOrder(g) {
    CUR = g; QTY = { biglietto: 0, grande: 0, piccola: 0, digitale: 0, calendario: 0 };
    const hasN = g.items.some(i => i.tipo === 'Natale'), hasC = g.items.some(i => i.tipo === 'Calendario');
    $('oTitle').textContent = g.gen + ' · ' + g.bamb;
    $('oTags').innerHTML = '';
    const tg = $('oTags');
    $('oCls').value = g.classe || '';
    const si = $('oIst'); si.innerHTML = '<option value="">Scegli…</option>';
    ISTITUTI.forEach(n => { const o = document.createElement('option'); o.value = n; o.textContent = n; si.appendChild(o); });
    si.value = ISTITUTI.indexOf(g.istituto) >= 0 ? g.istituto : '';
    if (g.ordinato) { const w = document.createElement('span'); w.className = 'tag warn'; w.textContent = 'Attenzione: esiste già un ordine per questa prenotazione'; tg.appendChild(w); }
    const defs = [];
    if (hasN) defs.push(['biglietto', 'Biglietto di auguri', () => PRICES.BIGLIETTO], ['grande', 'Foto grande', () => PRICES.FOTO_GRANDE],
                        ['piccola', 'Foto piccola', () => PRICES.FOTO_PICCOLA], ['digitale', 'Formato digitale', () => digFree() ? 0 : PRICES.DIGITALE, 1]);
    if (hasC) defs.push(['calendario', 'Calendario (copie)', () => PRICES.CAL_PRIMA, 99]);
    const L = $('lines'); L.innerHTML = '';
    defs.forEach(d => {
      const row = document.createElement('div'); row.className = 'row';
      row.innerHTML = '<div><b>' + d[1] + '</b><div class="muted" id="p_' + d[0] + '"></div></div><div class="step"><button type="button">−</button><span>0</span><button type="button">+</button></div>';
      const [bm, sp, bp] = [row.querySelectorAll('button')[0], row.querySelector('span'), row.querySelectorAll('button')[1]];
      const max = d[3] || 50;
      bm.onclick = () => { if (QTY[d[0]] > 0) { QTY[d[0]]--; sp.textContent = QTY[d[0]]; recalc(); } };
      bp.onclick = () => { if (QTY[d[0]] < max) { QTY[d[0]]++; sp.textContent = QTY[d[0]]; recalc(); } };
      L.appendChild(row);
    });
    $('metodo').value = ''; hide('eOrder'); recalc();
    $('searchCard').classList.add('hide'); $('orderCard').classList.remove('hide');
  }

  function digFree() { return GRATIS.some(k => QTY[k] > 0); }
  function total() {
    let t = 0;
    t += QTY.biglietto * PRICES.BIGLIETTO + QTY.grande * PRICES.FOTO_GRANDE + QTY.piccola * PRICES.FOTO_PICCOLA;
    if (QTY.digitale > 0 && !digFree()) t += PRICES.DIGITALE;
    if (QTY.calendario > 0) t += PRICES.CAL_PRIMA + (QTY.calendario - 1) * PRICES.CAL_EXTRA;
    return t;
  }
  function recalc() {
    const set = (k, txt) => { const e = $('p_' + k); if (e) e.textContent = txt; };
    set('biglietto', eur(PRICES.BIGLIETTO) + ' cad.'); set('grande', eur(PRICES.FOTO_GRANDE) + ' cad.'); set('piccola', eur(PRICES.FOTO_PICCOLA) + ' cad.');
    set('digitale', digFree() ? 'incluso con le stampe' : eur(PRICES.DIGITALE));
    set('calendario', '1ª copia ' + eur(PRICES.CAL_PRIMA) + ' · successive ' + eur(PRICES.CAL_EXTRA));
    $('total').textContent = eur(total());
  }

  $('bBack').onclick = () => { $('orderCard').classList.add('hide'); $('searchCard').classList.remove('hide'); };

  $('bConfirm').onclick = () => {
    hide('eOrder');
    if (total() === 0 && !Object.values(QTY).some(v => v > 0)) return show('eOrder', 'Nessun articolo selezionato.');
    if (!$('oCls').value.trim()) return show('eOrder', 'Indica la classe.');
    if (!$('oIst').value) return show('eOrder', 'Scegli l\'istituto di consegna.');
    if (!$('metodo').value) return show('eOrder', 'Scegli il metodo di pagamento.');
    $('bConfirm').disabled = true;
    const p = Object.assign({ bookingId: CUR.id, classe: $('oCls').value, istituto: $('oIst').value, metodo: $('metodo').value, operatore: $('oper').value }, QTY);
    api('cassaConfirm', { pin: PIN, data: p }).then(r => {
      $('bConfirm').disabled = false;
      if (!r.ok) return show('eOrder', r.error);
      $('doneLines').innerHTML = r.righe.map(l => '<div class="row"><span>' + l.label.replace(/</g, '&lt;') + ' ×' + l.qty + '</span><b>' + l.total + '</b></div>').join('');
      $('doneTot').textContent = r.totale;
      $('doneMail').textContent = r.mailSent ? 'Ricevuta inviata per email.' : 'ATTENZIONE: email non inviata. Controlla il foglio "Ordini".';
      $('orderCard').classList.add('hide'); $('doneCard').classList.remove('hide');
    }).catch(() => { $('bConfirm').disabled = false; show('eOrder', 'Connessione interrotta: controlla nel foglio "Ordini" se l\'ordine è stato registrato prima di riprovare.'); });
  };

  $('bNext').onclick = () => { $('doneCard').classList.add('hide'); $('searchCard').classList.remove('hide'); $('results').innerHTML = ''; $('q').value = ''; $('q').focus(); };
</script>
</body>
</html>
